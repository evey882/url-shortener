name: URL Shortener Pipeline
run-name: ${{ github.actor }} is updating the repository.
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v2
      - name: Build Docker image
        run: docker build -t url-shortener .
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Push the Docker image to Docker Hub
        run: docker push "${{ secrets.DOCKER_USERNAME }}"/url-shortener
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/url-shortener
            docker stop existing-container || true
            docker rm existing-container || true
            docker run -d --name existing-container ${{ secrets.DOCKER_USERNAME }}/url-shortener
